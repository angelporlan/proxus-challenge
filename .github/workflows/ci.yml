name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Run web tests
        run: pnpm --filter @proxus/web run test

      - name: Run server tests
        run: pnpm --filter @proxus/server run test

      - name: Build web
        run: pnpm --filter @proxus/web run build
